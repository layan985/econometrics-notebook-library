[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econometrics-notebook-library"
version = "0.1.0"
description = "Research-grade computational notes on modern applied econometrics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbclient>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["econnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
